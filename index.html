<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uma Última Mensagem 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.95)),
url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=1600');
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.card{
width:100%;
max-width:900px;
background:rgba(0,0,0,.70);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:50px;
text-align:center;
animation:fadeIn 2s ease;
box-shadow:0 0 50px rgba(0,0,0,.5);
}

h1{
color:#fff;
font-size:2.6rem;
margin-bottom:40px;
font-weight:600;
}

p{
color:#f1f1f1;
font-size:1.2rem;
line-height:2.2;
font-weight:300;
}

.destaque{
color:#ffffff;
font-weight:600;
}

.assinatura{
margin-top:40px;
font-size:1.8rem;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:768px){

.card{
padding:30px;
}

h1{
font-size:2rem;
}

p{
font-size:1rem;
line-height:2;
}

}

</style>
</head>

<body>

<div class="card">

<h1>Uma Última Mensagem 🤍</h1>

<p>

Sempre sentirei saudade de você.

<br><br>

Fiz isso porque não acho certo dividir você com alguém.

<br><br>

E o meu maior sonho agora é receber uma mensagem sua dizendo que resolveu a sua vida...

<br><br>

<span class="destaque">
...e que podemos organizar a nossa.
</span>

<br><br>

Mas até lá,

<br><br>

<span class="destaque">
estarei te esperando.
</span>

</p>

<div class="assinatura">
🤍
</div>

</div>

</body>
</html>
